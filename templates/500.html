<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Server Error | SHSD Link</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        /* পুরো Error Page-এর ডিজাইন */
        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Arial, sans-serif;

            background:
                radial-gradient(
                    circle at top,
                    #263b5c 0%,
                    #0b1220 45%,
                    #020617 100%
                );

            color: white;
        }

        /* মূল Card */
        .error-card {
            width: 92%;
            max-width: 600px;

            padding: 45px 30px;

            text-align: center;

            background: rgba(255, 255, 255, 0.08);

            border: 1px solid
                    rgba(255, 255, 255, 0.15);

            border-radius: 28px;

            box-shadow:
                0 25px 80px
                rgba(0, 0, 0, 0.45);

            backdrop-filter: blur(15px);
        }

        /* Error Icon */
        .error-icon {
            font-size: 75px;
            margin-bottom: 10px;
        }

        /* 500 */
        .error-code {
            margin: 0;

            font-size: 72px;
            font-weight: 900;

            letter-spacing: 3px;
        }

        /* Title */
        .error-title {
            margin-top: 10px;

            font-size: 27px;
            font-weight: 700;
        }

        /* Description */
        .error-message {
            margin-top: 15px;

            color: #cbd5e1;

            line-height: 1.8;

            font-size: 16px;
        }

        /* Home Button */
        .home-button {
            display: inline-block;

            margin-top: 22px;

            padding: 13px 28px;

            border-radius: 15px;

            background: white;

            color: #0f172a;

            text-decoration: none;

            font-weight: 700;

            transition: 0.2s;
        }

        .home-button:hover {
            transform: translateY(-3px);

            box-shadow:
                0 10px 30px
                rgba(255,255,255,0.15);
        }

        /* মোবাইলের জন্য */
        @media (max-width: 576px) {

            .error-card {
                padding: 35px 22px;
            }

            .error-icon {
                font-size: 60px;
            }

            .error-code {
                font-size: 58px;
            }

            .error-title {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

    <div class="error-card">

        <!-- Error Icon -->
        <div class="error-icon">
            ⚠️
        </div>

        <!-- Error Code -->
        <h1 class="error-code">
            500
        </h1>

        <!-- Title -->
        <h2 class="error-title">
            Server Error
        </h2>

        <!-- বাংলা Message -->
        <p class="error-message">
            দুঃখিত, আমাদের সার্ভারে একটি
            সাময়িক সমস্যা হয়েছে।<br>

            কিছুক্ষণ পরে আবার চেষ্টা করুন।
        </p>

        <!-- Home Button -->
        <a href="/" class="home-button">
            🏠 Home Page
        </a>

    </div>

</body>
</html>
